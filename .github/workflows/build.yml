name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MARKETPLACE_ITEM_ID: 877

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: tinted
          path: release/*.zip

      # Publishes when public/metadata.json carries a version the Marketplace does not have live yet
      - name: Publish to the Marketplace
        if: github.event_name == 'push' && env.API_TOKEN != ''
        run: |
          version=$(jq -r .version public/metadata.json)
          api="https://api.liquidbounce.net/api/v3/marketplace/$MARKETPLACE_ITEM_ID/revisions"
          live=$(curl -fsS "$api?limit=1" | jq -r '.items[0].version // empty')
          if [ "$live" = "$version" ]; then
            echo "$version is already live"
            exit 0
          fi
          curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@release/tinted-$version.zip" \
            -F "version=$version" \
            -F "changelog=$(git log -1 --format=%s)" \
            -F "source_repository=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -F "source_ref=$GITHUB_REF_NAME" \
            -F "source_commit=$GITHUB_SHA" \
            -F "source_build_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | jq '{id, version, status}'
