name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MARKETPLACE_ITEM_ID: 877

jobs:
  agent-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # agent-usage check compares .agent-usage/ with the base branch
          fetch-depth: 0

      - name: Check agent usage
        run: |
          curl -fsSLo "$RUNNER_TEMP/agent-usage" https://raw.githubusercontent.com/1zun4/agent-usage/v1.2.0/agent-usage
          echo "4dd8f5dbac6dc84c3552d038f9311061e4216a77e79c843cf68511aa76be7011  $RUNNER_TEMP/agent-usage" | sha256sum -c -
          python3 "$RUNNER_TEMP/agent-usage" check --base "origin/${GITHUB_BASE_REF:-main}" --style '*.svelte=block'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: tinted
          path: release/*.zip

      # Publishes when public/metadata.json carries a version the Marketplace does not have live yet
      - name: Publish to the Marketplace
        if: github.event_name == 'push' && env.API_TOKEN != ''
        run: |
          version=$(jq -r .version public/metadata.json)
          api="https://api.liquidbounce.net/marketplace/items/$MARKETPLACE_ITEM_ID/revisions"
          live=$(curl -fsS "$api?limit=1" | jq -r '.items[0].version // empty')
          if [ "$live" = "$version" ]; then
            echo "$version is already live"
            exit 0
          fi
          curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@release/tinted-$version.zip" \
            -F "version=$version" \
            -F "changelog=$(git log -1 --format=%s)" \
            -F "sourceRepository=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -F "sourceRef=$GITHUB_REF_NAME" \
            -F "sourceCommit=$GITHUB_SHA" \
            -F "sourceBuildUrl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | jq '{id, version, status}'
